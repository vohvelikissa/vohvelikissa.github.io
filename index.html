<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 4rem 3rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            line-height: 1.1;
        }

        p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.6;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .image-wrapper {
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            border-radius: 50%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            animation: pulse 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .image-wrapper img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
        }

        .arrows {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 2rem;
            font-size: 1.5rem;
            color: #764ba2;
            font-weight: 300;
        }

        .arrow::before,
        .arrow::after {
            content: '↔';
            animation: spin 2s linear infinite;
        }

        .arrow::after {
            animation-delay: 1s;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 3rem 2rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            p {
                font-size: 1rem;
            }

            .image-wrapper img {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Under Construction</div>
        
        <div class="image-wrapper">
            <img alt="Pessi under construction" src="./pessi.jpg">
        </div>
        
        <h1>Coming Soon</h1>
        
        <p>We're building something amazing. This is just a taste of what's to come.</p>
        
        <div class="arrows">
            <span class="arrow"></span>
            <span>More content</span>
            <span class="arrow"></span>
        </div>
    </div>
</body>
</html>
