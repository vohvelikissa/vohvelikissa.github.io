<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST_TITLE | Pessi Vilppolahti</title>
    <style>
        /* ============================================
           UNIFIED STYLING WITH MAIN SITE
           ============================================ */
        
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --accent-glow: rgba(52, 152, 219, 0.3);
            --light: #ecf0f1;
            --dark: #2c3e50;
            --text: #333;
            --text-light: #7f8c8d;
            --border: #bdc3c7;
            --shadow: rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }

        /* Navigation */
        .navbar {
            max-width: 800px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            text-align: center;
        }

        .navbar a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: var(--transition);
        }

        .navbar a:hover {
            background: rgba(52, 152, 219, 0.1);
            color: var(--accent);
        }

        /* Main Container - MATCHES YOUR HOMEPAGE */
        .contentparent {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .contentparent::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent), #2ecc71, #e74c3c));
        }

        /* Header */
        .contentparent h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            position: relative;
            padding-bottom: 1rem;
        }

        .contentparent h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #2ecc71));
            border-radius: 2px;
        }

        /* Post Meta */
        .post-meta {
            text-align: center;
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .post-meta span {
            display: inline-block;
            margin: 0 1rem;
        }

        .post-meta span::before {
            margin-right: 0.5rem;
        }

        .date::before {
            content: '📅';
        }

        .author::before {
            content: '✍️';
        }

        .reading-time::before {
            content: '⏱️';
        }

        /* Content Styling */
        .contentparent h2 {
            color: var(--primary);
            font-size: 1.6rem;
            font-weight: 600;
            margin: 2rem 0 1rem;
            padding-bottom: 0.5rem;
        }

        .contentparent h3 {
            color: var(--secondary);
            font-size: 1.3rem;
            font-weight: 600;
            margin: 1.8rem 0 0.8rem;
        }

        .contentparent p {
            margin-bottom: 1.2rem;
            color: var(--text);
            text-align: justify;
        }

        .contentparent ul,
        .contentparent ol {
            margin: 1rem 0 1.5rem 1.5rem;
            padding: 0;
        }

        .contentparent li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        .contentparent blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: var(--secondary);
            font-style: italic;
        }

        .contentparent code {
            background: rgba(52, 152, 219, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9rem;
        }

        .contentparent pre {
            background: rgba(52, 152, 219, 0.05);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1rem 0;
            border-left: 4px solid var(--accent);
        }

        .contentparent pre code {
            background: transparent;
            padding: 0;
        }

        .contentparent a {
            color: var(--accent);
            text-decoration: none;
            transition: var(--transition);
        }

        .contentparent a:hover {
            color: #2ecc71;
            text-decoration: underline;
        }

        /* Image Styling */
        .contentparent img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: block;
            margin: 1.5rem auto;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-light);
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .footer a:hover {
            color: #2ecc71;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0;
            }

            .contentparent {
                padding: 2rem 1.5rem;
                max-width: 95%;
                margin: 0 1rem;
            }

            .contentparent h1 {
                font-size: 2rem;
            }

            .contentparent h2 {
                font-size: 1.4rem;
            }

            .contentparent h3 {
                font-size: 1.2rem;
            }

            .contentparent p,
            .contentparent li {
                text-align: left;
            }
        }

        @media (max-width: 480px) {
            .contentparent {
                padding: 1.5rem 1rem;
            }

            .contentparent h1 {
                font-size: 1.7rem;
            }

            .contentparent h2 {
                font-size: 1.3rem;
            }

            .contentparent h3 {
                font-size: 1.1rem;
            }

            .navbar {
                padding: 0 1rem;
            }

            .navbar a {
                padding: 0.5rem;
                font-size: 1rem;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .contentparent {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }

            .contentparent::before {
                display: none;
            }

            .navbar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="http://vilppolahti.com">Home</a>
        <a href="http://vilppolahti.com/blog/index.html">Blog</a>
        <a href="http://vilppolahti.com/projects/index.html">Projects</a>
    </nav>

    <!-- Main Content -->
    <div class="contentparent">
        <h1>POST_TITLE</h1>
        
        <div class="post-meta">
            <span class="date">DATE</span>
            <span class="author">Pessi Vilppolahti</span>
            <span class="reading-time">READING_TIME min read</span>
        </div>

        <!-- Post Content Goes Here -->
        <p>Your blog post content goes here. Write in regular HTML or Markdown.</p>

    </div>
</body>
</html>
